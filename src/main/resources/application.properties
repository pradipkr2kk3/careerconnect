spring.application.name=careerconnect
server.port=${PORT:8080}

# ---- PostgreSQL (change these, or set the environment variables) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/careerconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Tables are created by src/main/resources/schema.sql on every start (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.error.include-message=always
server.servlet.session.timeout=60m

# Dates shown to users (change if you deploy in another time zone)
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Kolkata}
