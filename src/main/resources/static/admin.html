<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - CareerConnect</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin.html">Career<span>Connect</span> Admin</a>
    <nav><span class="who" id="who"></span><button class="btn ghost small" onclick="logout()">Log out</button></nav>
  </header>

  <div class="shell">
    <aside class="side">
      <button data-view="dashboard">Overview</button>
      <button data-view="users">Job seekers</button>
      <button data-view="companies">Recruiters</button>
    </aside>
    <main>
      <section class="view" id="view-dashboard"><h2>Overview</h2><div id="stats"></div></section>
      <section class="view" id="view-users"><h2>Job seekers</h2><div id="userList"></div></section>
      <section class="view" id="view-companies"><h2>Recruiters</h2><div id="companyList"></div></section>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
